; Replaces n.eko's chromium.conf:
;   - CDP on loopback 9222, which socat exposes on 9223;
;   - Chromium's sandbox ON;
;   - the profile on tmpfs;
;   - the container exits when Chromium exits.
[program:chromium]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/chromium
  --window-position=0,0
  --window-size=1280,800
  --display=%(ENV_DISPLAY)s
  --user-data-dir=/tmp/chromium-profile
  --no-first-run
  --no-default-browser-check
  --disable-gpu
  --disable-software-rasterizer
  --log-level=1
  --remote-debugging-address=127.0.0.1
  --remote-debugging-port=9222
stopsignal=INT
autorestart=false
startretries=0
priority=800
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/chromium.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=1
redirect_stderr=true

[program:openbox]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/openbox --config-file /etc/neko/openbox.xml
autorestart=true
priority=300
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/openbox.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=1
redirect_stderr=true

[program:cdp-proxy]
command=/usr/bin/socat TCP-LISTEN:9223,fork,reuseaddr TCP:127.0.0.1:9222
autorestart=true
priority=900
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/cdp-proxy.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=1
redirect_stderr=true

[eventlistener:exit-on-chromium]
command=/usr/local/bin/exit-on-chromium
events=PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
priority=100
stderr_logfile=/var/log/neko/exit-on-chromium.log

[program:idle-probe]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/socat TCP-LISTEN:9224,fork,reuseaddr EXEC:/usr/local/bin/slot-idle-http
autorestart=true
priority=900
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/idle-probe.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=1
redirect_stderr=true
