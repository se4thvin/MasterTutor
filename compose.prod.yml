      traefik.http.routers.mastertutor-live-upload-browser-3.middlewares: mastertutor-live-auth,mastertutor-live-upload-limit,mastertutor-live-strip,mastertutor-live-headers
      traefik.http.routers.mastertutor-live-upload-browser-3.service: mastertutor-live-browser-3
