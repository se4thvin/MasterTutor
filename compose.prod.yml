      traefik.http.routers.mastertutor-live-browser-3.priority: "1000"
      traefik.http.routers.mastertutor-live-browser-3.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.mastertutor-live-browser-3.tls: ${TRAEFIK_TLS:-true}
