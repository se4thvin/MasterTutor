      traefik.http.routers.mastertutor-live-browser-2.rule: 'Host(`${DOMAIN:?set DOMAIN}`) && PathRegexp(`^/live/[0-9a-f-]{36}/`) && HeaderRegexp(`Cookie`, `(?:^|;\s*)live_slot=browser-2\.`)'
