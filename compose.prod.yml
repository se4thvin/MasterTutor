# Production overlay (spec §13, D41, D42). Dokploy runs it as a docker-compose app (not a stack),
# isolated deployment OFF, randomize OFF, auto-deploy OFF, with COMPOSE_PROFILES=pdf,observability:
#   docker compose -p <app> -f compose.yml -f compose.prod.yml up -d --build --remove-orphans
# Never rename the app: volumes are <app>_pgdata etc. (infra/deploy-runbook.md).
# Bring these files up on the Dokploy host ONLY through the Dokploy app: a second project would
# register duplicate mastertutor-* routers on the shared Traefik and break live view.
#
# - No service joins Dokploy's shared dokploy-network (other tenants' service names such as
#   `postgres` would answer web's bare-name lookups). Traefik is attached to mastertutor-cdp at
#   .12 and reaches web (.11) and the slots there; web's own router below carries the domain and
#   its ACME certificate, so Dokploy's Domains tab stays empty.
# - /live routers use liveRouterRule(), liveUploadRouterRule() and liveForwardAuthAddress()
#   exactly (tests/compose/prod-overlay.int.test.ts), mirroring infra/traefik/test-dynamic.yml:
#   ForwardAuth targets web's STATIC cdp address .11, never the name `web`. Auth runs before the
#   upload limit and strip.
# - mastertutor-cdp is created once on the host (infra/host/create-cdp-network.sh) and Traefik is
#   attached at .12 (infra/host/attach-traefik.sh), so redeploys keep the attachment.
# - Images are tagged :prod, never the CI :local tags the shared host's test runs rebuild (D45).
# - Every service has memory, CPU, process and log bounds: the host is shared (infra/deploy-runbook.md §8).
# - Backups are Dokploy's (database + volume backups); this file adds no backup volume.
# - Local use without Dokploy (D47): TRAEFIK_ENTRYPOINT / TRAEFIK_TLS, plus one override that
#   re-declares cdp, drops AppArmor where the host has no profile and resets web's certresolver.

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

# D50: workers and slots log to the collector (spec §9). Async and non-blocking, so a down
# collector never stops or slows a container; Docker's dual-logging cache keeps `docker logs` and
# Dokploy's log viewer working (tests/observability/collector-config.int.test.ts).
x-container-logs: &container-logs
  logging:
    driver: fluentd
    options:
      fluentd-address: "127.0.0.1:24224"
      fluentd-async: "true"
      mode: non-blocking
      max-buffer-size: 4m
      tag: "mt.{{.Name}}"
      cache-disabled: "false"
      cache-max-size: 10m
      cache-max-file: "3"

x-live-middlewares: &live-middlewares
  traefik.enable: "true"
  traefik.docker.network: mastertutor-cdp
  traefik.http.middlewares.mastertutor-live-auth.forwardauth.address: "http://${CDP_SUBNET_PREFIX:-172.30.231}.11:3000/api/live/auth"
  traefik.http.middlewares.mastertutor-live-auth.forwardauth.authResponseHeaders: Cookie
  traefik.http.middlewares.mastertutor-live-auth.forwardauth.trustForwardHeader: "false"
  traefik.http.middlewares.mastertutor-live-upload-limit.buffering.maxRequestBodyBytes: "104857600"
  traefik.http.middlewares.mastertutor-live-strip.stripprefixregex.regex: "^/live/[0-9a-f-]{36}"
  traefik.http.middlewares.mastertutor-live-headers.headers.contentSecurityPolicy: "frame-ancestors 'self'"
  traefik.http.middlewares.mastertutor-live-headers.headers.contentTypeNosniff: "true"

# Six slots: 24 GiB and 12 CPUs in all, the bulk of the app's share of the host.
x-slot-prod: &slot-prod
  <<: *container-logs
  image: mastertutor/browser-slot:prod
  mem_limit: 4g
  cpus: 2
  # Threads count: Chromium, Xorg, PulseAudio and n.eko's GStreamer run several hundred.
  pids_limit: 4096
  security_opt:
    - apparmor=mastertutor-slot

x-node-runtime-prod: &node-runtime-prod
  <<: *logging
  image: mastertutor/node-runtime:prod

services:
  postgres:
    <<: *logging
    mem_limit: 2g
    cpus: 2
    pids_limit: 512

  garage:
    <<: *logging
    mem_limit: 1g
    cpus: 1
    pids_limit: 256

  garage-init:
    <<: *node-runtime-prod
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    environment:
      S3_OBSERVE_ACCESS_KEY_ID: ${S3_OBSERVE_ACCESS_KEY_ID:?set S3_OBSERVE_ACCESS_KEY_ID}
      S3_OBSERVE_SECRET_ACCESS_KEY: ${S3_OBSERVE_SECRET_ACCESS_KEY:?set S3_OBSERVE_SECRET_ACCESS_KEY}

  migrate:
    <<: *node-runtime-prod
    mem_limit: 1g
    cpus: 1
    pids_limit: 128

  web:
    <<: *logging
    image: mastertutor/web:prod
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    environment:
      OPENAI_BASE_URL: ""
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?set VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?set VAPID_PRIVATE_KEY}
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:?set ALERT_WEBHOOK_SECRET}
      OBSERVE_VIEWER_PASSWORD: ${OBSERVE_VIEWER_PASSWORD:?set OBSERVE_VIEWER_PASSWORD}
    labels:
      traefik.enable: "true"
      traefik.docker.network: mastertutor-cdp
      traefik.http.routers.mastertutor-web.rule: "Host(`${DOMAIN:?set DOMAIN}`)"
      traefik.http.routers.mastertutor-web.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.mastertutor-web.tls: ${TRAEFIK_TLS:-true}
      traefik.http.routers.mastertutor-web.tls.certresolver: letsencrypt
      traefik.http.routers.mastertutor-web.service: mastertutor-web
      traefik.http.services.mastertutor-web.loadbalancer.server.port: "3000"
      # http:// answers with a permanent redirect to https:// (our own middleware, no Dokploy file
      # provider). The D47 local override resets these four, since there `web` serves the app.
      traefik.http.routers.mastertutor-web-http.rule: "Host(`${DOMAIN:?set DOMAIN}`)"
      traefik.http.routers.mastertutor-web-http.entrypoints: web
      traefik.http.routers.mastertutor-web-http.middlewares: mastertutor-https-redirect
      traefik.http.routers.mastertutor-web-http.service: mastertutor-web
      traefik.http.middlewares.mastertutor-https-redirect.redirectscheme.scheme: https
      traefik.http.middlewares.mastertutor-https-redirect.redirectscheme.permanent: "true"
      # obs.${DOMAIN}/api/observability/session is web's (the owner's hand-off to the obs host, D50):
      # above the OpenObserve router, without its ForwardAuth.
      traefik.http.routers.mastertutor-observability-session.rule: "Host(`obs.${DOMAIN:?set DOMAIN}`) && Path(`/api/observability/session`)"
      traefik.http.routers.mastertutor-observability-session.priority: "950"
      traefik.http.routers.mastertutor-observability-session.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.mastertutor-observability-session.tls: ${TRAEFIK_TLS:-true}
      traefik.http.routers.mastertutor-observability-session.tls.certresolver: letsencrypt
      traefik.http.routers.mastertutor-observability-session.service: mastertutor-web

  observer:
    <<: *logging
    image: mastertutor/observer:prod
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    environment:
      OPENAI_BASE_URL: ""
      DATABASE_URL: postgres://observer_role:${OBSERVER_DB_PASSWORD:?set OBSERVER_DB_PASSWORD}@postgres:5432/mastertutor
      OBSERVER_INTERNAL_TOKEN: ${OBSERVER_INTERNAL_TOKEN:?set OBSERVER_INTERNAL_TOKEN}
      OBSERVE_COPILOT_PASSWORD: ${OBSERVE_COPILOT_PASSWORD:?set OBSERVE_COPILOT_PASSWORD}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      MT_DEPLOYMENT: production
    labels:
      traefik.enable: "true"
      traefik.docker.network: mastertutor-obs
      # observerRouterRule(DOMAIN) and observerForwardAuthAddress() exactly (prod-overlay.int.test.ts).
      traefik.http.routers.mastertutor-observer.rule: "Host(`${DOMAIN:?set DOMAIN}`) && PathPrefix(`/api/observer/`)"
      traefik.http.routers.mastertutor-observer.priority: "960"
      traefik.http.routers.mastertutor-observer.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.mastertutor-observer.tls: ${TRAEFIK_TLS:-true}
      traefik.http.routers.mastertutor-observer.tls.certresolver: letsencrypt
      traefik.http.routers.mastertutor-observer.middlewares: mastertutor-observer-auth,mastertutor-observer-headers
      traefik.http.routers.mastertutor-observer.service: mastertutor-observer
      traefik.http.services.mastertutor-observer.loadbalancer.server.port: "4000"
      traefik.http.middlewares.mastertutor-observer-auth.forwardauth.address: "http://${CDP_SUBNET_PREFIX:-172.30.231}.11:3000/api/observer-auth"
      traefik.http.middlewares.mastertutor-observer-auth.forwardauth.authResponseHeaders: Authorization,Cookie,X-Mt-User,X-Mt-Workspace
      traefik.http.middlewares.mastertutor-observer-auth.forwardauth.trustForwardHeader: "false"
      traefik.http.middlewares.mastertutor-observer-headers.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.mastertutor-observer-headers.headers.customResponseHeaders.Cache-Control: "no-store"

  agent:
    <<: *node-runtime-prod
    # Run loop, screencast encoding and extractors.
    mem_limit: 4g
    cpus: 2
    pids_limit: 1024
    environment:
      AGENT_TEST_MODE: "0"
      OPENAI_BASE_URL: ""
      # Production always runs profile pdf (COMPOSE_PROFILES=pdf, scripts/deploy/check-env.ts).
      DOCLING_URL: http://docling:5001
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

  # Bounds and hardening are in compose.yml; production adds the image tag and its logs (D50).
  pdf-worker:
    <<: [*container-logs, *node-runtime-prod]

  # Bounds and hardening are in compose.yml; production adds the image tag and its logs (D50).
  audio-capture:
    <<: *container-logs
    image: mastertutor/audio-capture:prod

  # Bounds and hardening are in compose.yml; production adds its logs (D50).
  docling:
    <<: *container-logs

  # Bounds and hardening are in compose.yml; production adds the secret and log limits (D50).
  otel-collector:
    <<: *logging
    environment:
      OBSERVE_INGEST_PASSWORD: ${OBSERVE_INGEST_PASSWORD:?set OBSERVE_INGEST_PASSWORD}

  observability-init:
    <<: *node-runtime-prod
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 64
    environment:
      OBSERVE_ROOT_PASSWORD: ${OBSERVE_ROOT_PASSWORD:?set OBSERVE_ROOT_PASSWORD}
      OBSERVE_INGEST_PASSWORD: ${OBSERVE_INGEST_PASSWORD:?set OBSERVE_INGEST_PASSWORD}
      OBSERVE_VIEWER_PASSWORD: ${OBSERVE_VIEWER_PASSWORD:?set OBSERVE_VIEWER_PASSWORD}
      OBSERVE_COPILOT_PASSWORD: ${OBSERVE_COPILOT_PASSWORD:?set OBSERVE_COPILOT_PASSWORD}
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:?set ALERT_WEBHOOK_SECRET}

  # OpenObserve on its own host, obs.${DOMAIN} (D50 ruling I-2): owner-only through ForwardAuth to
  # web's static cdp address (spec §12), with observabilityRouterRule() and
  # observabilityForwardAuthAddress() exactly (tests/compose/prod-overlay.int.test.ts). Its one path
  # web serves, /api/observability/session, has its own router on web. Traefik reaches OpenObserve
  # over mastertutor-obs (infra/host/create-obs-network.sh); OpenObserve publishes no port.
  openobserve:
    <<: *logging
    environment:
      ZO_ROOT_USER_PASSWORD: ${OBSERVE_ROOT_PASSWORD:?set OBSERVE_ROOT_PASSWORD}
      ZO_S3_ACCESS_KEY: ${S3_OBSERVE_ACCESS_KEY_ID:?set S3_OBSERVE_ACCESS_KEY_ID}
      ZO_S3_SECRET_KEY: ${S3_OBSERVE_SECRET_ACCESS_KEY:?set S3_OBSERVE_SECRET_ACCESS_KEY}
      ZO_WEB_URL: https://obs.${DOMAIN:?set DOMAIN}/observability
    labels:
      traefik.enable: "true"
      traefik.docker.network: mastertutor-obs
      traefik.http.routers.mastertutor-observability.rule: "Host(`obs.${DOMAIN:?set DOMAIN}`)"
      traefik.http.routers.mastertutor-observability.priority: "900"
      traefik.http.routers.mastertutor-observability.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.mastertutor-observability.tls: ${TRAEFIK_TLS:-true}
      traefik.http.routers.mastertutor-observability.tls.certresolver: letsencrypt
      traefik.http.routers.mastertutor-observability.middlewares: mastertutor-observability-root,mastertutor-observability-auth,mastertutor-live-headers
      traefik.http.routers.mastertutor-observability.service: mastertutor-observability
      traefik.http.services.mastertutor-observability.loadbalancer.server.port: "5080"
      traefik.http.middlewares.mastertutor-observability-auth.forwardauth.address: "http://${CDP_SUBNET_PREFIX:-172.30.231}.11:3000/api/observability/auth"
      traefik.http.middlewares.mastertutor-observability-auth.forwardauth.authResponseHeaders: Authorization,Cookie
      traefik.http.middlewares.mastertutor-observability-auth.forwardauth.trustForwardHeader: "false"
      traefik.http.middlewares.mastertutor-observability-root.redirectregex.regex: "^(https?://[^/]+)/?$$"
      traefik.http.middlewares.mastertutor-observability-root.redirectregex.replacement: "$${1}/observability/web/"

  browser-1:
    <<: *slot-prod
    environment:
      SLOT_EGRESS_ALLOW_CIDRS: ""
    labels:
      <<: *live-middlewares
      traefik.http.routers.mastertutor-live-browser-1.rule: 'Host(`${DOMAIN:?set DOMAIN}`) && PathRegexp(`^/live/[0-9a-f-]{36}/`) && HeaderRegexp(`Cookie`, `(?:^|;\s*)live_slot=browser-1\.`)'
      traefik.http.routers.mastertutor-live-browser-1.priority: "1000"
      traefik.http.routers.mastertutor-live-browser-1.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.mastertutor-live-browser-1.tls: ${TRAEFIK_TLS:-true}
      traefik.http.routers.mastertutor-live-browser-1.middlewares: mastertutor-live-auth,mastertutor-live-strip,mastertutor-live-headers
      traefik.http.routers.mastertutor-live-browser-1.service: mastertutor-live-browser-1
      traefik.http.routers.mastertutor-live-upload-browser-1.rule: 'Host(`${DOMAIN:?set DOMAIN}`) && PathRegexp(`^/live/[0-9a-f-]{36}/api/room/upload/`) && HeaderRegexp(`Cookie`, `(?:^|;\s*)live_slot=browser-1\.`)'
      traefik.http.routers.mastertutor-live-upload-browser-1.priority: "1001"
      traefik.http.routers.mastertutor-live-upload-browser-1.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.mastertutor-live-upload-browser-1.tls: ${TRAEFIK_TLS:-true}
      traefik.http.routers.mastertutor-live-upload-browser-1.middlewares: mastertutor-live-auth,mastertutor-live-upload-limit,mastertutor-live-strip,mastertutor-live-headers
      traefik.http.routers.mastertutor-live-upload-browser-1.service: mastertutor-live-browser-1
      traefik.http.services.mastertutor-live-browser-1.loadbalancer.server.port: "8080"

