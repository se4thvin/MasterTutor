      traefik.http.routers.mastertutor-live-upload-browser-2.tls: ${TRAEFIK_TLS:-true}
      traefik.http.routers.mastertutor-live-upload-browser-2.middlewares: mastertutor-live-auth,mastertutor-live-upload-limit,mastertutor-live-strip,mastertutor-live-headers
      traefik.http.routers.mastertutor-live-upload-browser-2.service: mastertutor-live-browser-2
