      traefik.http.routers.mastertutor-live-upload-browser-2.rule: 'Host(`${DOMAIN:?set DOMAIN}`) && PathRegexp(`^/live/[0-9a-f-]{36}/api/room/upload/`) && HeaderRegexp(`Cookie`, `(?:^|;\s*)live_slot=browser-2\.`)'
      traefik.http.routers.mastertutor-live-upload-browser-2.priority: "1001"
      traefik.http.routers.mastertutor-live-upload-browser-2.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.mastertutor-live-upload-browser-2.tls: ${TRAEFIK_TLS:-true}
      traefik.http.routers.mastertutor-live-upload-browser-2.middlewares: mastertutor-live-auth,mastertutor-live-upload-limit,mastertutor-live-strip,mastertutor-live-headers
      traefik.http.routers.mastertutor-live-upload-browser-2.service: mastertutor-live-browser-2
      traefik.http.services.mastertutor-live-browser-2.loadbalancer.server.port: "8080"

