# MasterTutor: one Compose app (spec §3.1, §13). Local: `pnpm env:init`, then use compose.test.yml.
name: mastertutor

# Only `migrate` builds this image; agent, garage-init and pdf-worker reuse the tag (several
# services building one tag fails on Docker Desktop with "image already exists"). audio-capture
# builds its own image on top of it (target `audio-capture`, which adds parec). Always start with
# `--build`.
x-node-runtime: &node-runtime
  image: mastertutor/node-runtime:local
  networks:
    - backend

x-node-health: &node-health
  interval: 5s
  timeout: 3s
  retries: 20
  start_period: 10s

x-slot-env: &slot-env
  NEKO_WEBRTC_NAT1TO1: ${PUBLIC_IP:?set PUBLIC_IP}
  NEKO_ADMIN_SECRET: ${NEKO_ADMIN_SECRET:?set NEKO_ADMIN_SECRET}
  NEKO_MEMBER_SECRET: ${NEKO_MEMBER_SECRET:?set NEKO_MEMBER_SECRET}
  CDP_ALLOWED_IP: ${CDP_SUBNET_PREFIX:-172.30.231}.10
  # Only audio-capture records a slot's audio (B4 review I7), over the `pulse` network.
  PULSE_ALLOWED_IP: ${PULSE_SUBNET_PREFIX:-172.30.233}.10
  NEKO_ALLOWED_IPS: ${CDP_SUBNET_PREFIX:-172.30.231}.10,${CDP_SUBNET_PREFIX:-172.30.231}.11,${CDP_SUBNET_PREFIX:-172.30.231}.12
  SLOT_EGRESS_ALLOW_CIDRS: ${SLOT_EGRESS_ALLOW_CIDRS:-}

x-browser-slot: &browser-slot
  image: mastertutor/browser-slot:local
  build:
    context: ./apps/browser-slot
  restart: always
  shm_size: 2gb
  cap_add:
    - NET_ADMIN
  # IPv6 is closed twice: here and by the entrypoint's ip6tables fallback.
  sysctls:
    net.ipv6.conf.all.disable_ipv6: 1
    net.ipv6.conf.default.disable_ipv6: 1
  security_opt:
    - seccomp=./apps/browser-slot/seccomp/chromium.json
  tmpfs:
    - /tmp/chromium-profile:uid=1000,gid=1000,mode=0700
  volumes:
    - downloads:/downloads
  networks:
    cdp: {}
    egress: {}
    pulse: {}

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: mastertutor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owner -d mastertutor"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - backend
      - observer-db

  garage:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN}
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      backend: {}
      # OpenObserve's only route to its bucket (D50); its key reaches nothing else.
      observe-store: {}

  garage-init:
    <<: *node-runtime
    restart: "no"
    command: ["node", "packages/storage/src/bin/garage-init.ts"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN}
      S3_BUCKET: mastertutor
      S3_WEB_ACCESS_KEY_ID: ${S3_WEB_ACCESS_KEY_ID:?set S3_WEB_ACCESS_KEY_ID}
      S3_WEB_SECRET_ACCESS_KEY: ${S3_WEB_SECRET_ACCESS_KEY:?set S3_WEB_SECRET_ACCESS_KEY}
      S3_AGENT_ACCESS_KEY_ID: ${S3_AGENT_ACCESS_KEY_ID:?set S3_AGENT_ACCESS_KEY_ID}
      S3_AGENT_SECRET_ACCESS_KEY: ${S3_AGENT_SECRET_ACCESS_KEY:?set S3_AGENT_SECRET_ACCESS_KEY}
      # OpenObserve's own bucket and key (D50), provisioned only when the key is set.
      S3_OBSERVE_BUCKET: observability
      S3_OBSERVE_ACCESS_KEY_ID: ${S3_OBSERVE_ACCESS_KEY_ID:-}
      S3_OBSERVE_SECRET_ACCESS_KEY: ${S3_OBSERVE_SECRET_ACCESS_KEY:-}
    depends_on:
      garage:
        condition: service_healthy

  migrate:
    <<: *node-runtime
    build:
      context: .
      target: node-runtime
    restart: "no"
    command: ["node", "packages/db/src/bin/migrate.ts"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://owner:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/mastertutor
      WEB_DB_PASSWORD: ${WEB_DB_PASSWORD:?set WEB_DB_PASSWORD}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:?set AGENT_DB_PASSWORD}
      OBSERVER_DB_PASSWORD: ${OBSERVER_DB_PASSWORD:-}
      BROWSER_SLOTS: ${BROWSER_SLOTS:-browser-1,browser-2,browser-3,browser-4,browser-5,browser-6}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: mastertutor/web:local
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://web_role:${WEB_DB_PASSWORD:?set WEB_DB_PASSWORD}@postgres:5432/mastertutor
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${PUBLIC_URL:?set PUBLIC_URL}
      AUTH_SIGNUP_OPEN: ${AUTH_SIGNUP_OPEN:-0}
      VAULT_PUBLIC_KEY: ${VAULT_PUBLIC_KEY:?set VAULT_PUBLIC_KEY}
      NEKO_MEMBER_SECRET: ${NEKO_MEMBER_SECRET:?set NEKO_MEMBER_SECRET}
      LIVE_COOKIE_SECRET: ${LIVE_COOKIE_SECRET:?set LIVE_COOKIE_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      S3_ENDPOINT: http://garage:3900
      S3_REGION: garage
      S3_BUCKET: mastertutor
      S3_ACCESS_KEY_ID: ${S3_WEB_ACCESS_KEY_ID:?set S3_WEB_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_WEB_SECRET_ACCESS_KEY:?set S3_WEB_SECRET_ACCESS_KEY}
      # D50: telemetry is off unless the endpoint is set; push, the alert webhook and
      # /observability are each off while their key is empty.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      MT_DEPLOYMENT: ${MT_DEPLOYMENT:-production}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:-}
      OBSERVE_VIEWER_PASSWORD: ${OBSERVE_VIEWER_PASSWORD:-}
      OBSERVER_INTERNAL_TOKEN: ${OBSERVER_INTERNAL_TOKEN:-}
      # Its cdp address (<prefix>.11) is the Host Traefik's ForwardAuth calls carry (D50 I-1).
      CDP_SUBNET_PREFIX: ${CDP_SUBNET_PREFIX:-172.30.231}
    healthcheck:
      <<: *node-health
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
    depends_on:
      migrate:
        condition: service_completed_successfully
      garage-init:
        condition: service_completed_successfully
    networks:
      edge: {}
      backend: {}
      cdp:
        ipv4_address: ${CDP_SUBNET_PREFIX:-172.30.231}.11
      # D50: exports to the collector; receives OpenObserve's alert webhook.
      telemetry: {}
      observe: {}

  agent:
    <<: *node-runtime
    restart: unless-stopped
    # The telemetry preload registers instrumentations before main.ts's imports load node:http
    # (D50, spec §6.3); it does nothing unless OTEL_EXPORTER_OTLP_ENDPOINT is set.
    command:
      ["node", "--import", "./packages/telemetry/src/register-agent.ts", "apps/agent/src/main.ts"]
    # Graceful stop: running runs sleep with a wake, then slot restarts get AGENT_SHUTDOWN_DRAIN_MS.
    stop_grace_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://agent_role:${AGENT_DB_PASSWORD:?set AGENT_DB_PASSWORD}@postgres:5432/mastertutor
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      # Set only when COMPOSE_PROFILES includes "pdf"; compose.prod.yml pins it.
      DOCLING_URL: ${DOCLING_URL:-}
      PDF_WORKER_URL: http://pdf-worker:5002
      AUDIO_CAPTURE_URL: http://audio-capture:5003
      VAULT_PRIVATE_KEY: ${VAULT_PRIVATE_KEY:?set VAULT_PRIVATE_KEY}
      NEKO_ADMIN_SECRET: ${NEKO_ADMIN_SECRET:?set NEKO_ADMIN_SECRET}
      S3_ENDPOINT: http://garage:3900
      S3_REGION: garage
      S3_BUCKET: mastertutor
      S3_ACCESS_KEY_ID: ${S3_AGENT_ACCESS_KEY_ID:?set S3_AGENT_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_AGENT_SECRET_ACCESS_KEY:?set S3_AGENT_SECRET_ACCESS_KEY}
      BROWSER_SLOTS: ${BROWSER_SLOTS:-browser-1,browser-2,browser-3,browser-4,browser-5,browser-6}
      AGENT_TEST_MODE: ${AGENT_TEST_MODE:-0}
      AGENT_HEALTH_PORT: "8787"
      AGENT_SHUTDOWN_DRAIN_MS: ${AGENT_SHUTDOWN_DRAIN_MS:-5000}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      MT_DEPLOYMENT: ${MT_DEPLOYMENT:-production}
    volumes:
      - downloads:/downloads
    healthcheck:
      <<: *node-health
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
    depends_on:
      migrate:
        condition: service_completed_successfully
      garage-init:
        condition: service_completed_successfully
    # No dependency on docling or pdf-worker: a PDF falls back to pdf.js while docling is down
    # or still loading its models, and to pdf_unavailable while pdf-worker restarts (final I7).
    networks:
      backend: {}
      cdp:
        ipv4_address: ${CDP_SUBNET_PREFIX:-172.30.231}.10
      pdf: {}
      audio: {}
      telemetry: {}

  # Every slot recording happens here, never in the agent (B4 review I7): parec pulls a slot's
  # PulseAudio over `pulse` (shared with the slots only; they admit port 4713 from this address
  # alone), and the agent fetches chunks over `audio` (shared with the agent only): it reaches
  # neither web nor Traefik nor CDP. Finished chunks wait on a tmpfs until the agent reads them
  # (each deleted once read, all of them on restart). No secrets, read-only root, non-root uid, no
  # capabilities, its own memory, CPU and process bounds.
  audio-capture:
    image: mastertutor/audio-capture:local
    build:
      context: .
      target: audio-capture
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    # One 600 s chunk is 19.2 MB; a chunk waits only until the agent reads it.
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1
    pids_limit: 64
    healthcheck:
      <<: *node-health
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5003/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
    networks:
      audio: {}
      pulse:
        ipv4_address: ${PULSE_SUBNET_PREFIX:-172.30.233}.10

  # Every PDF is parsed here, never in the agent (B5 review I-1): pdf.js in a `node --permission`
  # child per PDF, two at a time. No secrets, no egress (only the internal `pdf` network, shared
  # with the agent), read-only root, non-root uid, its own memory, CPU and process bounds.
  pdf-worker:
    image: mastertutor/node-runtime:local
    restart: unless-stopped
    command: ["node", "apps/agent/src/pdf/worker/server.ts"]
    user: "1000:1000"
    # A crash, an OOM kill or an exit restarts it; a hung child is killed per PDF at 120 s.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Two PDFs at once fit (PDF_MEMORY_BUDGET_BYTES, asserted in tests/compose).
    mem_limit: 4g
    cpus: 2
    pids_limit: 128
    healthcheck:
      <<: *node-health
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5002/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
    networks:
      - pdf

  # High-fidelity PDF path (spec §7.6), profile `pdf`. Only the agent can reach it: it has no route
  # to Postgres, Garage or the internet (B5 decision 17, preflight S4), so its models are baked in.
  docling:
    image: quay.io/docling-project/docling-serve-cpu:v1.36.0@sha256:225c8586e20d5d0fc6811a9e0e044fa602bcc4393f00389009bad42d6787b58f
    profiles: ["pdf"]
    restart: unless-stopped
    # The image's own non-root user, pinned (final review I8); its files are group 0 (OpenShift layout).
    user: "1001:0"
    read_only: true
    tmpfs:
      - /tmp:size=1g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 6g
    cpus: 2
    pids_limit: 512
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
      DOCLING_SERVE_ENABLE_REMOTE_SERVICES: "false"
      DOCLING_SERVE_MAX_FILE_SIZE: "104857600"
      DOCLING_SERVE_MAX_NUM_PAGES: "500"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3).status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    networks:
      - pdf

  # Telemetry pipeline (D50, spec §10). Profile `observability`: test stacks never run it, and
  # nothing waits on it; web and agent export to it only when OTEL_EXPORTER_OTLP_ENDPOINT is set.
  # The image is distroless with no healthcheck subcommand, so it has no healthcheck (B1).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    environment:
      OBSERVE_INGEST_PASSWORD: ${OBSERVE_INGEST_PASSWORD:-}
      # o2OtlpEndpoint (packages/observability): the API lives under OpenObserve's base path.
      OBSERVE_OTLP_ENDPOINT: http://openobserve:5080/observability/api/default
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    # The Docker daemon's fluentd log driver connects here (spec §9); loopback only (D45).
    ports:
      - "127.0.0.1:24224:24224/tcp"
    networks:
      telemetry: {}
      observe: {}
      obs-ingest: {}

  # Storage, search and dashboards (spec §11). Internal only: its one route in is Traefik's
  # owner-only /observability router (compose.prod.yml). Distroless (no shell, curl or wget), so no
  # healthcheck: observability-init polls /healthz itself (B1). The O2_REQUIRED_ENV block is
  # pinned by tests/compose/prod-mode.ts; ZO_SKIP_SSRF_CHECKS lets it call web's webhook on the
  # internal `observe` network (it has no egress).
  openobserve:
    image: openobserve/openobserve:v1.0.4@sha256:d4a878fac1f6c56003764f7f2a1625668917388f167e222c8c810de3f54c56ba
    profiles: ["observability"]
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 1
    pids_limit: 256
    environment:
      ZO_ROOT_USER_EMAIL: root@mastertutor.internal
      ZO_ROOT_USER_PASSWORD: ${OBSERVE_ROOT_PASSWORD:-}
      ZO_DATA_DIR: /data
      ZO_LOCAL_MODE: "true"
      ZO_LOCAL_MODE_STORAGE: s3
      ZO_S3_PROVIDER: s3
      ZO_S3_SERVER_URL: http://garage:3900
      ZO_S3_REGION_NAME: garage
      ZO_S3_BUCKET_NAME: observability
      ZO_S3_ACCESS_KEY: ${S3_OBSERVE_ACCESS_KEY_ID:-}
      ZO_S3_SECRET_KEY: ${S3_OBSERVE_SECRET_ACCESS_KEY:-}
      ZO_COOKIE_SECURE_ONLY: "true"
      ZO_COMPACT_DATA_RETENTION_DAYS: "90"
      ZO_BASE_URI: /observability
      ZO_TELEMETRY: "false"
      ZO_USAGE_REPORTING_ENABLED: "false"
      ZO_MMDB_DISABLE_DOWNLOAD: "true"
      ZO_SKIP_SSRF_CHECKS: "true"
    volumes:
      - openobserve-data:/data
    depends_on:
      garage-init:
        condition: service_completed_successfully
    networks:
      observe: {}
      observe-store: {}
      observe-edge: {}

  # Idempotent provisioning (spec §11): users, retention, alert delivery, dashboards, alerts.
  observability-init:
    <<: *node-runtime
    profiles: ["observability"]
    restart: "no"
    command: ["node", "packages/observability/src/bin/observability-init.ts"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OBSERVE_URL: http://openobserve:5080/observability
      OBSERVE_ROOT_PASSWORD: ${OBSERVE_ROOT_PASSWORD:-}
      # Only for the one deploy that rotates root (runbook §13).
      OBSERVE_ROOT_PASSWORD_PREVIOUS: ${OBSERVE_ROOT_PASSWORD_PREVIOUS:-}
      OBSERVE_INGEST_PASSWORD: ${OBSERVE_INGEST_PASSWORD:-}
      OBSERVE_VIEWER_PASSWORD: ${OBSERVE_VIEWER_PASSWORD:-}
      OBSERVE_COPILOT_PASSWORD: ${OBSERVE_COPILOT_PASSWORD:-}
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:-}
      ALERT_WEBHOOK_URL: http://web:3000/api/alerts/webhook
      SPEND_ALERT_USD_PER_HOUR: ${SPEND_ALERT_USD_PER_HOUR:-25}
    depends_on:
      openobserve:
        condition: service_started
    networks:
      - observe

  # D52 (spec §5.1): the Copilot's backend. Least privilege: observer_role over schema observer, its
  # isolated query proxy, OpenAI egress only, no S3/vault/auth secret, no published port.
  observer:
    image: mastertutor/observer:local
    build:
      context: .
      target: observer
    profiles: [observability]
    restart: unless-stopped
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://observer_role:${OBSERVER_DB_PASSWORD:-}@postgres:5432/mastertutor
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL}
      OBSERVER_INTERNAL_TOKEN: ${OBSERVER_INTERNAL_TOKEN:-}
      OBSERVER_QUERY_TOKEN: ${OBSERVER_QUERY_TOKEN:-}
      OBSERVER_QUERY_URL: http://observer-query:4001
      OBSERVER_DAILY_USD: ${OBSERVER_DAILY_USD:-3}
    healthcheck:
      <<: *node-health
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
    depends_on:
      migrate:
        condition: service_completed_successfully
      observer-query:
        condition: service_healthy
    networks:
      - observer-db
      - observer-query
      - observer-edge
      - telemetry
      - observer-egress

  # OSS OpenObserve only has admin users. This process alone holds the query credential.
  observer-query:
    image: mastertutor/observer:local
    build:
      context: .
      target: observer
    command: ["node", "apps/observer/src/query-proxy-main.ts"]
    profiles: [observability]
    restart: unless-stopped
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      OBSERVE_COPILOT_PASSWORD: ${OBSERVE_COPILOT_PASSWORD:-}
      OBSERVER_QUERY_TOKEN: ${OBSERVER_QUERY_TOKEN:-}
    healthcheck:
      <<: *node-health
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://observer-query-private:4001/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
    depends_on:
      observability-init:
        condition: service_completed_successfully
    networks:
      observer-query:
        aliases: [observer-query-private]
      observe: {}

  browser-1:
    <<: *browser-slot
    environment:
      <<: *slot-env
      SLOT_NAME: browser-1
      NEKO_WEBRTC_UDPMUX: "59001"
      NEKO_WEBRTC_TCPMUX: "59001"
    ports: ["59001:59001/udp", "59001:59001/tcp"]

  browser-2:
    <<: *browser-slot
    environment:
      <<: *slot-env
      SLOT_NAME: browser-2
      NEKO_WEBRTC_UDPMUX: "59002"
      NEKO_WEBRTC_TCPMUX: "59002"
    ports: ["59002:59002/udp", "59002:59002/tcp"]

  browser-3:
    <<: *browser-slot
    environment:
      <<: *slot-env
      SLOT_NAME: browser-3
      NEKO_WEBRTC_UDPMUX: "59003"
      NEKO_WEBRTC_TCPMUX: "59003"
    ports: ["59003:59003/udp", "59003:59003/tcp"]

  browser-4:
    <<: *browser-slot
    environment:
      <<: *slot-env
      SLOT_NAME: browser-4
      NEKO_WEBRTC_UDPMUX: "59004"
      NEKO_WEBRTC_TCPMUX: "59004"
    ports: ["59004:59004/udp", "59004:59004/tcp"]

  browser-5:
    <<: *browser-slot
    environment:
      <<: *slot-env
      SLOT_NAME: browser-5
      NEKO_WEBRTC_UDPMUX: "59005"
      NEKO_WEBRTC_TCPMUX: "59005"
    ports: ["59005:59005/udp", "59005:59005/tcp"]

  browser-6:
    <<: *browser-slot
    environment:
      <<: *slot-env
      SLOT_NAME: browser-6
      NEKO_WEBRTC_UDPMUX: "59006"
      NEKO_WEBRTC_TCPMUX: "59006"
    ports: ["59006:59006/udp", "59006:59006/tcp"]

networks:
  observer-query:
    internal: true
  observer-edge:
    internal: true
  observer-db:
    internal: true
  # The isolated Copilot service has an outbound interface for its OpenAI client only.
  observer-egress: {}
  edge: {}
  backend: {}
  egress: {}
  cdp:
    internal: true
    ipam:
      config:
        - subnet: ${CDP_SUBNET_PREFIX:-172.30.231}.0/24
          ip_range: ${CDP_SUBNET_PREFIX:-172.30.231}.128/25
  # The agent and the PDF parsers only: pdf-worker always, docling under profile `pdf`.
  pdf:
    internal: true
  # audio-capture ↔ slots (PulseAudio only); the agent never joins it (B4 re-review I7).
  pulse:
    internal: true
    ipam:
      config:
        - subnet: ${PULSE_SUBNET_PREFIX:-172.30.233}.0/24
          ip_range: ${PULSE_SUBNET_PREFIX:-172.30.233}.128/25
  # agent ↔ audio-capture (finished chunks).
  audio:
    internal: true
  # D50 (spec §4.2): one internal network per hop of the telemetry stack.
  telemetry:
    internal: true
  observe:
    internal: true
  observe-store:
    internal: true
  # Traefik ↔ OpenObserve and Copilot; compose.prod.yml makes it the external mastertutor-obs.
  observe-edge:
    internal: true
  # Only so the collector can publish its loopback fluent-forward port (spec §4.2): Docker cannot
  # publish a port from a container on internal networks only. No IP masquerade, so the collector
  # (it parses untrusted log lines and holds an OpenObserve credential) has no route out
  # (review I2, tests/observability/collector-config.int.test.ts).
  obs-ingest:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"

volumes:
  pgdata: {}
  garage-meta: {}
  garage-data: {}
  downloads: {}
  openobserve-data: {}
