server {
  listen 80 default_server;
  return 404;
}

server {
  listen 80;
  server_name site.fixtures.test;
  root /srv/fixtures/site;
  default_type text/html;
  add_header Cache-Control "no-store" always;
  location = /redirect-other { return 302 http://other.fixtures.test/; }
  # A POST target for the form-resubmission tests (static files answer POST with 405).
  location = /posted { return 200 '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Order placed</title></head><body><p>Order placed</p></body></html>'; }
  location / { try_files $uri $uri.html $uri/index.html =404; }
}

server {
  listen 80;
  # other.fixtures-isolated.test is another site, so Chromium puts its frames out of process;
  # ads.fixtures-hung.test is a third site, for a frame that hangs (it never shares their process).
  server_name other.fixtures.test other.fixtures-isolated.test ads.fixtures-hung.test;
  root /srv/fixtures/other;
  default_type text/html;
  add_header Cache-Control "no-store" always;
  # One widget for every origin (frame tests embed it same-origin and cross-site).
  location = /widget.html { root /srv/fixtures/site; }
  location / { try_files $uri $uri.html $uri/index.html =404; }
}
