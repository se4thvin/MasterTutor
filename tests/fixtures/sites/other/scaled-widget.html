<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Scaled widget</title>
    <style>
      body {
        margin: 0;
      }
      iframe {
        position: absolute;
        left: 10px;
        top: 10px;
        width: 300px;
        height: 200px;
        border: 2px solid;
        transform: scale(0.8);
        transform-origin: 0 0;
      }
    </style>
  </head>
  <body>
    <iframe title="Account" src="/widget.html"></iframe>
  </body>
</html>
