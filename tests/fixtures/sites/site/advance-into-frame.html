<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Code entry</title>
    <style>
      body {
        margin: 0;
      }
      input {
        position: absolute;
        left: 40px;
        top: 20px;
        width: 200px;
        height: 30px;
      }
      iframe {
        position: absolute;
        left: 40px;
        top: 80px;
        width: 400px;
        height: 150px;
        border: 0;
      }
    </style>
  </head>
  <body>
    <input id="code" aria-label="Code" />
    <iframe
      title="Sign in"
      srcdoc='<input id="pw" type="password" aria-label="Password"><input id="note" aria-label="Note">'
    ></iframe>
    <script>
      // ?into=pw|note: after 4 characters, a page script moves focus into the frame mid-typing.
      // ?into=new: it creates a new frame with a password field and focuses that instead.
      // ?frames=N: N tiny frames come first (many documents to arm).
      const params = new URLSearchParams(location.search);
      const into = params.get("into") ?? "pw";
      for (let i = 0; i < Number(params.get("frames") ?? 0); i++) {
        const tiny = document.createElement("iframe");
        tiny.srcdoc = "x";
        tiny.style.cssText = "position: static; width: 4px; height: 4px";
        document.body.append(tiny);
      }
      document.getElementById("code").addEventListener("input", (event) => {
        if (event.target.value.length !== 4) return;
        if (into !== "new") {
          document.querySelector("iframe").contentDocument.getElementById(into).focus();
          return;
        }
        const frame = document.createElement("iframe");
        document.body.append(frame);
        frame.contentDocument.body.innerHTML = '<input id="pw" type="password">';
        frame.contentDocument.getElementById("pw").focus();
        window.__leaked = () => frame.contentDocument.getElementById("pw").value;
      });
    </script>
  </body>
</html>
