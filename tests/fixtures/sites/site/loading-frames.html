<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lesson</title>
    <style>
      body {
        margin: 0;
      }
      #go {
        position: absolute;
        left: 0;
        top: 50px;
        width: 200px;
        height: 40px;
      }
      iframe {
        position: absolute;
        border: 0;
      }
    </style>
  </head>
  <body>
    <button id="go" onclick="window.__clicked = this.id">Continue</button>
    <script>
      // Frames from another site whose documents load slowly (the test holds their requests).
      const params = new URLSearchParams(location.search);
      const frame = (left, top) => {
        const element = document.createElement("iframe");
        element.title = "Advert";
        element.src = "http://other.fixtures-isolated.test/widget.html?loading";
        element.style.cssText = `left: ${left}px; top: ${top}px; width: 100px; height: 100px`;
        document.body.append(element);
        return element;
      };
      // ?ads=N: N such frames well away from the button.
      for (let i = 0; i < Number(params.get("ads") ?? 0); i++) frame(400 + i * 120, 300);
      // ?near: one 4 px right of the button's right edge (x 204).
      if (params.has("near")) frame(204, 40);
      // ?grow=N: one far away that, N ms after the pointer enters the button, grows to end 4 px
      // right of its right edge.
      const button = document.getElementById("go");
      if (params.has("grow")) {
        const far = frame(600, 400);
        button.addEventListener("mouseenter", () =>
          setTimeout(
            () => {
              far.style.left = "204px";
              far.style.top = "40px";
              far.style.width = "300px";
            },
            Number(params.get("grow")),
          ),
        );
      }
      // ?leave: when the pointer enters the button, the page itself navigates (the main frame).
      if (params.has("leave"))
        button.addEventListener("mouseenter", () => (location.href = "/interactive.html?held"));
    </script>
  </body>
</html>
