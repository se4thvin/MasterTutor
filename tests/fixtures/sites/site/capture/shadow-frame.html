<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shadow frame (cross-origin, same process)</title>
    <style>
      body {
        margin: 0;
      }
      #art {
        width: 400px;
        height: 200px;
        background: #2a6;
      }
      #pw {
        position: absolute;
        left: 20px;
        top: 240px;
        width: 200px;
        height: 30px;
      }
      #host {
        position: absolute;
        left: 600px;
        top: 20px;
      }
    </style>
  </head>
  <body>
    <div id="art"></div>
    <input id="pw" type="password" value="hunter2-canary" aria-label="Password" />
    <div id="host"></div>
    <script>
      document.getElementById("host").attachShadow({ mode: "open" }).innerHTML =
        '<iframe src="http://other.fixtures.test/index.html" title="Other site" style="width:300px;height:150px;border:0"></iframe>';
    </script>
  </body>
</html>
