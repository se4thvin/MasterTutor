<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixed cross-origin frame</title>
    <style>
      body {
        margin: 0;
        height: 3000px;
        background: #2a6;
      }
      #widget {
        position: fixed;
        left: 0;
        top: 0;
        width: 300px;
        height: 150px;
        border: 0;
      }
    </style>
  </head>
  <body>
    <iframe id="widget" src="http://other.fixtures.test/index.html" title="Sign-in widget"></iframe>
  </body>
</html>
