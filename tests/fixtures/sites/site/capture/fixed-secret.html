<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixed code field</title>
    <style>
      body {
        margin: 0;
        height: 3000px;
        background: #2a6;
      }
      #otp {
        position: fixed;
        left: 20px;
        bottom: 10px;
        width: 200px;
        height: 30px;
      }
    </style>
  </head>
  <body>
    <input id="otp" type="password" autocomplete="one-time-code" value="481516" aria-label="Code" />
  </body>
</html>
