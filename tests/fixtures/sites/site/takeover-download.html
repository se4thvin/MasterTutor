<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Takeover download fixture</title>

      html,
      body {
        margin: 0;
        height: 100%;
        background: #ffffff;
        font:
          20px system-ui,
          sans-serif;
      }
      #report {
        position: fixed;
        inset: 15% 20%;
        display: grid;
        place-items: center;
        background: rgb(20, 60, 200);
        color: #fff;
      }

  </head>

    <a id="report" href="/files/report.csv">Download the quarterly report</a>
