<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Account actions</title>
    <style>
      body {
        margin: 0;
      }
      button {
        position: absolute;
        left: 0;
        width: 200px;
        height: 40px;
      }
    </style>
  </head>
  <body>
    <button id="cancel" style="top: 50px" onclick="parent.__clicked = this.id">Cancel</button>
    <button id="delete" style="top: 100px" onclick="parent.__clicked = this.id">
      Delete account
    </button>
  </body>
</html>
