<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Photosynthesis in 20 seconds - YouTube</title>
    <meta
      name="description"
      content="A four-part tour of photosynthesis: intro, light reactions, the Calvin cycle and a summary."
    />
    <link rel="canonical" href="https://www.youtube.com/watch?v=fakevid0001" />
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
      }
      #movie_player {
        position: relative;
        width: 640px;
        height: 360px;
        margin: 16px;
      }
      video {
        width: 640px;
        height: 360px;
        display: block;
        background: #000;
      }
      .caption-window {
        position: absolute;
        bottom: 24px;
        left: 0;
        right: 0;
        text-align: center;
        color: #fff;
        font-size: 18px;
      }
      #description {
        white-space: pre-line;
        margin: 16px;
      }
    </style>
    <script>
      var ytInitialData = {
        playerOverlays: {
          playerOverlayRenderer: {
            decoratedPlayerBarRenderer: {
              decoratedPlayerBarRenderer: {
                playerBar: {
                  multiMarkersPlayerBarRenderer: {
                    markersMap: [
                      {
                        key: "DESCRIPTION_CHAPTERS",
                        value: {
                          chapters: [
                            {
                              chapterRenderer: {
                                title: { simpleText: "Intro" },
                                timeRangeStartMillis: 0,
                              },
                            },
                            {
                              chapterRenderer: {
                                title: { simpleText: "Light reactions" },
                                timeRangeStartMillis: 5000,
                              },
                            },
                            {
                              chapterRenderer: {
                                title: { simpleText: "Calvin cycle" },
                                timeRangeStartMillis: 10000,
                              },
                            },
                            {
                              chapterRenderer: {
                                title: { simpleText: "Summary" },
                                timeRangeStartMillis: 15000,
                              },
                            },
                          ],
                        },
                      },
                    ],
                  },
                },
              },
            },
          },
        },
      };
    </script>
  </head>
  <body>
    <div id="movie_player" class="html5-video-player">
      <video class="html5-main-video" src="video.webm" preload="auto" playsinline></video>
      <div class="caption-window" aria-live="polite"></div>
    </div>
    <button
      class="ytp-subtitles-button ytp-button"
      aria-pressed="false"
      title="Subtitles/closed captions (c)"
      data-track="api/timedtext?v=fakevid0001&amp;lang=en&amp;fmt=json3"
    >
      CC
    </button>
    <div id="description">
      Photosynthesis in four short chapters. 0:00 Intro 0:05 Light reactions 0:10 Calvin cycle 0:15
      Summary
    </div>
    <script src="player.js"></script>
  </body>
</html>
