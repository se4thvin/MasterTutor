<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Masking fixture</title>
    <style>
      body {
        margin: 0;
        font: 16px sans-serif;
      }
      input {
        position: absolute;
        height: 28px;
        font-size: 18px;
      }
      .otp-box {
        width: 28px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <input
      id="password"
      type="password"
      value="hunter2-secret"
      style="left: 40px; top: 40px; width: 240px"
    />
    <input
      id="otp"
      autocomplete="one-time-code"
      value="123456"
      style="left: 40px; top: 100px; width: 240px"
    />
    <input id="pin" name="pin" value="9876" style="left: 40px; top: 160px; width: 240px" />
    <input id="plain" value="visible text" style="left: 40px; top: 220px; width: 240px" />
    <script>
      for (let i = 0; i < 6; i++) {
        const box = document.createElement("input");
        box.className = "otp-box";
        box.inputMode = "numeric";
        box.maxLength = 1;
        box.value = String(i);
        box.style.left = `${40 + i * 40}px`;
        box.style.top = "280px";
        document.body.append(box);
      }
      window.__mutations = [];
      new MutationObserver((records) => {
        for (const r of records) window.__mutations.push(r.type);
      }).observe(document, {
        subtree: true,
        childList: true,
        attributes: true,
        characterData: true,
      });
      if (new URLSearchParams(location.search).get("moving") === "1") {
        const pw = document.getElementById("password");
        let x = 40;
        const step = () => {
          x = x >= 400 ? 40 : x + 7;
          pw.style.left = `${x}px`;
          requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      }
    </script>
  </body>
</html>
