# Agent-behaviour test stack (spec §12): two real slots plus static fixtures. Test-only.
# The slots publish CDP on 127.0.0.1 so a host-side Vitest process can drive them, and accept
# CDP from any source (CDP_ALLOWED_IP=0.0.0.0/0). Production never does either (Phase 0 compose.yml).
# The slot entrypoint passes CDP_ALLOWED_IP to iptables unvalidated, so a CIDR must stay accepted.
# n.eko (8080) and the idle probe (9224) are published on 127.0.0.1 too, for the B6 live-view tests (F9);
# the same allow-all rule as CDP applies (F12).
# The defaults are the laptop's fixed ports, subnet and image. On the shared CI host each run gets its
# own (scripts/remote-test/slots.sh), so several behaviour stacks run at once; constants.ts reads the
# same variables.
name: mastertutor-behaviour

x-slot: &slot
  image: ${BEHAVIOUR_SLOT_IMAGE:-mastertutor/browser-slot:local}
  restart: always
  shm_size: 1gb
  cap_add: [NET_ADMIN]
  security_opt:
    - seccomp=../../apps/browser-slot/seccomp/chromium.json
  tmpfs:
    - /tmp/chromium-profile:uid=1000,gid=1000,mode=0700
  # The downloads volume on a host folder, so a test (the agent's side) sees what the slot saved.
  volumes:
    - ${BEHAVIOUR_DOWNLOADS:-/tmp/mastertutor-behaviour-downloads}:/downloads
  networks: [behaviour]
  depends_on:
    fixtures:
      condition: service_started

x-slot-env: &slot-env
  NEKO_ADMIN_SECRET: behaviour-admin-secret-0123456789abcdef
  NEKO_MEMBER_SECRET: behaviour-member-secret-0123456789abcde
  CDP_ALLOWED_IP: 0.0.0.0/0
  NEKO_ALLOWED_IPS: 0.0.0.0/0
  SLOT_EGRESS_ALLOW_CIDRS: ${BEHAVIOUR_SUBNET_PREFIX:-172.30.240}.0/24

services:
  fixtures:
    image: nginx:1.30.5-alpine-slim
    volumes:
      - ../fixtures/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../fixtures/sites:/srv/fixtures:ro
    networks:
      behaviour:
        aliases:
          [
            site.fixtures.test,
            other.fixtures.test,
            other.fixtures-isolated.test,
            ads.fixtures-hung.test,
          ]

  browser-1:
    <<: *slot
    environment:
      <<: *slot-env
      SLOT_NAME: browser-1
    ports:
      - 127.0.0.1:${BEHAVIOUR_CDP_PORT_1:-19223}:9223
      - 127.0.0.1:${BEHAVIOUR_NEKO_PORT_1:-18091}:8080
      - 127.0.0.1:${BEHAVIOUR_IDLE_PORT_1:-18191}:9224

  browser-2:
    <<: *slot
    environment:
      <<: *slot-env
      SLOT_NAME: browser-2
    ports:
      - 127.0.0.1:${BEHAVIOUR_CDP_PORT_2:-19224}:9223
      - 127.0.0.1:${BEHAVIOUR_NEKO_PORT_2:-18092}:8080
      - 127.0.0.1:${BEHAVIOUR_IDLE_PORT_2:-18192}:9224

networks:
  behaviour:
    ipam:
      config:
        - subnet: ${BEHAVIOUR_SUBNET_PREFIX:-172.30.240}.0/24
