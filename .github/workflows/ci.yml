name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high

  integration:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Vault integration tests drive a real local Chromium.
      - run: pnpm --filter @mastertutor/agent exec playwright-core install --with-deps chromium
      - run: pnpm test:int

  security:
    name: Security tests (spec §12)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mastertutor/agent exec playwright-core install --with-deps chromium
      - run: pnpm test:security

  agent-image:
    name: Agent image carries no test code
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-agent-image.sh

  compose-smoke:
    name: Browser slot + Compose smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Allow unprivileged user namespaces (Chromium sandbox inside the slot)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bash apps/browser-slot/test/verify.sh
      - run: bash scripts/compose-smoke.sh

  behaviour:
    name: Agent behaviour (real slots)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Allow unprivileged user namespaces (Chromium sandbox inside the slot)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker build -t mastertutor/browser-slot:local apps/browser-slot
      - run: pnpm test:behaviour

  ui:
    name: UI (Playwright, 5 breakpoints, layout QA + axe)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mastertutor/web exec playwright install --with-deps chromium
      # A production build (no WEB_FIXTURE_API) must ship no fixture code and no server env names.
      - run: pnpm --filter @mastertutor/web build
      - run: pnpm --filter @mastertutor/web check:bundle
      # D43: delight is welcome, unbounded weight is not. Each route may grow at most budgetKb.
      - run: pnpm --filter @mastertutor/web check:first-load
      - run: pnpm test:ui
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
